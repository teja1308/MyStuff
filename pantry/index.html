<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Pantry</title>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --text: #1f2421; --muted: #6b726d;
    --border: #e3e1da; --accent: #2f7d5b; --accent-ink: #ffffff;
    --warn: #b7791f; --warn-bg: #fdf3e1; --danger: #c0392b; --danger-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141715; --card: #1d211f; --text: #e8ebe9; --muted: #9aa39e;
      --border: #2e3431; --accent: #4fb386; --accent-ink: #0d1a14;
      --warn: #e8b04e; --warn-bg: #3a2e17; --danger: #ef7a6c; --danger-bg: #3d1f1b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 12px 16px 0; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  nav { display: flex; gap: 4px; }
  nav button { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent;
    padding: 8px 4px; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
    border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  section[hidden] { display: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; color: inherit; }
  input, select { background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .btn { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.small { padding: 4px 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin-bottom: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .item .name { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }
  .qty .n { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; margin-left: 6px; }
  .tag.low { background: var(--warn-bg); color: var(--warn); }
  .tag.exp { background: var(--danger-bg); color: var(--danger); }
  .tag.soon { background: var(--warn-bg); color: var(--warn); }
  .group-title { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; font-size: 13px; }
  .shop-item { display: flex; align-items: center; gap: 10px; }
  .shop-item input[type=checkbox] { width: 20px; height: 20px; }
  .shop-item.done .label { text-decoration: line-through; color: var(--muted); }
  .shop-item .label { flex: 1; }
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--card);
    color: var(--text); width: min(460px, calc(100vw - 32px)); padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .form .full { grid-column: 1 / -1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .grow { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>🥫 Home Pantry</h1>
  <nav>
    <button data-tab="stock" class="active">Stock</button>
    <button data-tab="shop">Shopping <span id="shopBadge" class="badge" hidden></span></button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>

<main>
  <!-- STOCK -->
  <section id="tab-stock">
    <div class="stats">
      <div class="stat" data-filter="expiring"><b id="statExp">0</b><span>Expiring ≤ 3 days</span></div>
      <div class="stat" data-filter="low"><b id="statLow">0</b><span>Running low</span></div>
      <div class="stat" data-filter="all"><b id="statAll">0</b><span>Items</span></div>
    </div>
    <div class="row" style="margin-bottom:8px">
      <input id="search" class="grow" type="search" placeholder="Search items…">
      <button class="btn primary" id="addBtn">+ Add item</button>
    </div>
    <div class="row">
      <select id="filterLoc"><option value="">All locations</option></select>
      <select id="filterStatus">
        <option value="all">All items</option>
        <option value="expiring">Expiring soon / expired</option>
        <option value="low">Running low</option>
        <option value="out">Out of stock</option>
      </select>
      <select id="sortBy">
        <option value="category">Group by category</option>
        <option value="location">Group by location</option>
        <option value="expiry">Sort by expiry</option>
        <option value="name">Sort A–Z</option>
      </select>
    </div>
    <div id="stockList"></div>
  </section>

  <!-- SHOPPING -->
  <section id="tab-shop" hidden>
    <form id="shopForm" class="row" style="margin-bottom:12px">
      <input id="shopInput" class="grow" placeholder="Add to shopping list…" autocomplete="off" list="knownItems">
      <button class="btn primary">Add</button>
    </form>
    <datalist id="knownItems"></datalist>
    <div id="shopList"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="restockBtn">Put checked items in pantry</button>
      <button class="btn" id="copyShopBtn">Copy list</button>
    </div>
    <p class="meta" style="color:var(--muted);font-size:13px">Items at or below their "low" level are added automatically.</p>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings" hidden>
    <div class="card">
      <b>Backup</b>
      <p style="color:var(--muted);margin:4px 0 10px">Data is stored only in this browser. Export regularly, or to move to another device.</p>
      <div class="row">
        <button class="btn" id="exportBtn">Export JSON</button>
        <label class="btn">Import JSON<input id="importFile" type="file" accept="application/json" hidden></label>
        <button class="btn" id="sampleBtn">Load sample data</button>
      </div>
    </div>
    <div class="card">
      <b>Locations</b>
      <p style="color:var(--muted);margin:4px 0 10px">Comma-separated.</p>
      <div class="row"><input id="locInput" class="grow"><button class="btn" id="locSave">Save</button></div>
    </div>
    <div class="card">
      <b>Danger zone</b>
      <div class="row" style="margin-top:8px"><button class="btn" id="wipeBtn" style="color:var(--danger)">Delete all data</button></div>
    </div>
  </section>
</main>

<dialog id="itemDialog">
  <form method="dialog" id="itemForm">
    <h3 id="dialogTitle" style="margin:0 0 12px">Add item</h3>
    <div class="form">
      <label class="full">Name<input name="name" required list="knownItems" autocomplete="off"></label>
      <label>Quantity<input name="qty" type="number" min="0" step="any" value="1" required></label>
      <label>Unit<input name="unit" placeholder="pcs, kg, L…" list="units"></label>
      <label>Category<input name="category" list="categories" placeholder="e.g. Dairy"></label>
      <label>Location<select name="location"></select></label>
      <label>Expiry date<input name="expiry" type="date"></label>
      <label>Low when ≤<input name="low" type="number" min="0" step="any" placeholder="e.g. 1"></label>
      <label class="full">Notes<input name="notes"></label>
    </div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button type="button" class="btn" id="deleteItemBtn" style="color:var(--danger)">Delete</button>
      <div class="row">
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </div>
  </form>
</dialog>
<datalist id="units"><option>pcs</option><option>g</option><option>kg</option><option>ml</option><option>L</option><option>pack</option><option>can</option><option>bottle</option><option>dozen</option></datalist>
<datalist id="categories"></datalist>

<script>
const KEY = 'pantry.v1';
const DEFAULT_CATEGORIES = ['Produce', 'Dairy', 'Meat & Fish', 'Bakery', 'Grains & Pasta', 'Canned', 'Spices', 'Snacks', 'Drinks', 'Frozen', 'Household'];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.items)) return { locations: ['Pantry', 'Fridge', 'Freezer'], shopping: [], ...s };
  } catch (e) {}
  return { items: [], shopping: [], locations: ['Pantry', 'Fridge', 'Freezer'] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert('Could not save: ' + e.message); }
  render();
}

// ---- helpers ----
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtQty = (n) => Number.isInteger(n) ? n : +n.toFixed(2);
function daysUntil(date) {
  if (!date) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(date + 'T00:00:00') - today) / 86400000);
}
const isLow = (i) => i.low !== '' && i.low != null && i.qty <= Number(i.low);
const isExpiring = (i) => { const d = daysUntil(i.expiry); return d !== null && d <= 3; };

// Shopping list = manual entries + low-stock items not already listed
function shoppingView() {
  const manual = state.shopping;
  const names = new Set(manual.map(s => s.name.toLowerCase()));
  const auto = state.items.filter(i => isLow(i) && !names.has(i.name.toLowerCase()))
    .map(i => ({ id: 'auto-' + i.id, name: i.name, auto: true, done: false }));
  return [...manual, ...auto];
}

// ---- rendering ----
function render() {
  // stats
  $('#statExp').textContent = state.items.filter(isExpiring).length;
  $('#statLow').textContent = state.items.filter(isLow).length;
  $('#statAll').textContent = state.items.length;

  // dropdowns / datalists
  const locSel = $('#filterLoc'), cur = locSel.value;
  locSel.innerHTML = '<option value="">All locations</option>' + state.locations.map(l => `<option ${l === cur ? 'selected' : ''}>${esc(l)}</option>`).join('');
  $('#itemForm').location.innerHTML = state.locations.map(l => `<option>${esc(l)}</option>`).join('');
  const cats = [...new Set([...DEFAULT_CATEGORIES, ...state.items.map(i => i.category).filter(Boolean)])];
  $('#categories').innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('');
  const known = [...new Set(state.items.map(i => i.name))];
  $('#knownItems').innerHTML = known.map(n => `<option>${esc(n)}</option>`).join('');
  $('#locInput').value = state.locations.join(', ');

  renderStock();
  renderShop();
}

function renderStock() {
  const q = $('#search').value.trim().toLowerCase();
  const loc = $('#filterLoc').value;
  const status = $('#filterStatus').value;
  const sort = $('#sortBy').value;

  let items = state.items.filter(i =>
    (!q || i.name.toLowerCase().includes(q) || (i.category || '').toLowerCase().includes(q) || (i.notes || '').toLowerCase().includes(q)) &&
    (!loc || i.location === loc) &&
    (status === 'all' || (status === 'expiring' && isExpiring(i)) || (status === 'low' && isLow(i)) || (status === 'out' && i.qty <= 0)));

  const list = $('#stockList');
  if (!state.items.length) {
    list.innerHTML = `<div class="empty">Your pantry is empty.<br><br><button class="btn primary" onclick="openItem()">Add your first item</button> <button class="btn" onclick="loadSample()">Try sample data</button></div>`;
    return;
  }
  if (!items.length) { list.innerHTML = '<div class="empty">No items match.</div>'; return; }

  const byName = (a, b) => a.name.localeCompare(b.name);
  if (sort === 'expiry' || sort === 'name') {
    items.sort(sort === 'name' ? byName : (a, b) => (a.expiry || '9999').localeCompare(b.expiry || '9999') || byName(a, b));
    list.innerHTML = items.map(itemHTML).join('');
    return;
  }
  const key = sort; // category | location
  const groups = {};
  items.forEach(i => (groups[i[key] || 'Other'] ??= []).push(i));
  list.innerHTML = Object.keys(groups).sort().map(g =>
    `<div class="group-title">${esc(g)} · ${groups[g].length}</div>` + groups[g].sort(byName).map(itemHTML).join('')).join('');
}

function itemHTML(i) {
  const d = daysUntil(i.expiry);
  let tags = '';
  if (d !== null && d < 0) tags += `<span class="tag exp">expired ${-d}d ago</span>`;
  else if (d === 0) tags += `<span class="tag exp">expires today</span>`;
  else if (d !== null && d <= 3) tags += `<span class="tag soon">${d}d left</span>`;
  if (i.qty <= 0) tags += `<span class="tag exp">out</span>`;
  else if (isLow(i)) tags += `<span class="tag low">low</span>`;
  const meta = [i.location, i.category, i.expiry && d > 3 ? 'exp ' + i.expiry : '', i.notes].filter(Boolean).map(esc).join(' · ');
  const step = (i.unit && /^(g|ml)$/i.test(i.unit)) ? 100 : 1;
  return `<div class="card item">
    <div onclick="openItem('${i.id}')" style="cursor:pointer">
      <div class="name">${esc(i.name)}${tags}</div>
      <div class="meta">${meta}</div>
    </div>
    <div class="qty">
      <button aria-label="less" onclick="bump('${i.id}', -${step})">−</button>
      <span class="n">${fmtQty(i.qty)} ${esc(i.unit || '')}</span>
      <button aria-label="more" onclick="bump('${i.id}', ${step})">+</button>
    </div>
  </div>`;
}

function renderShop() {
  const list = shoppingView();
  const pending = list.filter(s => !s.done).length;
  const badge = $('#shopBadge');
  badge.hidden = !pending; badge.textContent = pending;
  $('#shopList').innerHTML = list.length ? list.map(s => `
    <div class="card shop-item ${s.done ? 'done' : ''}">
      <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleShop('${s.id}')">
      <span class="label">${esc(s.name)}${s.auto ? ' <span class="tag low">low stock</span>' : ''}</span>
      ${s.auto ? '' : `<button class="link" onclick="removeShop('${s.id}')">remove</button>`}
    </div>`).join('') : '<div class="empty">Nothing to buy 🎉</div>';
}

// ---- actions ----
function bump(id, delta) {
  const i = state.items.find(x => x.id === id);
  i.qty = Math.max(0, +(i.qty + delta).toFixed(3));
  save();
}

let editingId = null;
function openItem(id) {
  editingId = id || null;
  const f = $('#itemForm'); f.reset();
  const i = state.items.find(x => x.id === id);
  $('#dialogTitle').textContent = i ? 'Edit item' : 'Add item';
  $('#deleteItemBtn').hidden = !i;
  if (i) for (const k of ['name', 'qty', 'unit', 'category', 'location', 'expiry', 'low', 'notes']) f[k].value = i[k] ?? '';
  else if ($('#filterLoc').value) f.location.value = $('#filterLoc').value;
  $('#itemDialog').showModal();
  f.name.focus();
}

$('#itemForm').addEventListener('submit', (e) => {
  if (e.submitter?.value !== 'save') return;
  const f = e.target;
  const data = {
    name: f.name.value.trim(), qty: Number(f.qty.value) || 0, unit: f.unit.value.trim(),
    category: f.category.value.trim(), location: f.location.value, expiry: f.expiry.value,
    low: f.low.value === '' ? '' : Number(f.low.value), notes: f.notes.value.trim(),
  };
  if (!data.name) return;
  if (editingId) Object.assign(state.items.find(x => x.id === editingId), data);
  else {
    // Merge into an existing item with same name + location + expiry instead of duplicating
    const dup = state.items.find(x => x.name.toLowerCase() === data.name.toLowerCase() && x.location === data.location && (x.expiry || '') === data.expiry);
    if (dup) dup.qty += data.qty; else state.items.push({ id: uid(), added: new Date().toISOString().slice(0, 10), ...data });
  }
  save();
});
$('#cancelBtn').onclick = () => $('#itemDialog').close();
$('#deleteItemBtn').onclick = () => {
  if (!confirm('Delete this item?')) return;
  state.items = state.items.filter(x => x.id !== editingId);
  $('#itemDialog').close(); save();
};

function toggleShop(id) {
  if (id.startsWith('auto-')) {
    const item = state.items.find(i => 'auto-' + i.id === id);
    state.shopping.push({ id: uid(), name: item.name, done: true });
  } else {
    const s = state.shopping.find(x => x.id === id); s.done = !s.done;
  }
  save();
}
function removeShop(id) { state.shopping = state.shopping.filter(s => s.id !== id); save(); }

$('#shopForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('#shopInput').value.trim();
  if (!name) return;
  if (!state.shopping.some(s => s.name.toLowerCase() === name.toLowerCase() && !s.done))
    state.shopping.push({ id: uid(), name, done: false });
  $('#shopInput').value = ''; save();
});

// Checked items: bump matching pantry item by 1 (or prompt to add it), then remove from list
$('#restockBtn').onclick = () => {
  const done = state.shopping.filter(s => s.done);
  if (!done.length) return alert('Tick the items you bought first.');
  const unknown = [];
  done.forEach(s => {
    const item = state.items.find(i => i.name.toLowerCase() === s.name.toLowerCase());
    if (item) item.qty = +(item.qty + Math.max(1, Number(item.low) || 0)).toFixed(3);
    else unknown.push(s.name);
  });
  unknown.forEach(name => state.items.push({ id: uid(), name, qty: 1, unit: '', category: '', location: state.locations[0], expiry: '', low: '', notes: '', added: new Date().toISOString().slice(0, 10) }));
  state.shopping = state.shopping.filter(s => !s.done);
  save();
  alert(`Restocked ${done.length} item(s).` + (unknown.length ? `\nNew items added (edit them to set details): ${unknown.join(', ')}` : '') + '\nTip: update expiry dates on fresh items.');
};
$('#copyShopBtn').onclick = async () => {
  const text = shoppingView().filter(s => !s.done).map(s => '• ' + s.name).join('\n');
  try { await navigator.clipboard.writeText(text || '(empty)'); alert('Copied!'); } catch (e) { prompt('Copy this:', text); }
};

// ---- settings ----
$('#exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  a.download = `pantry-${new Date().toISOString().slice(0, 10)}.json`; a.click();
};
$('#importFile').onchange = async (e) => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(data.items)) throw new Error('No items array');
    if (confirm(`Replace current data with ${data.items.length} imported items?`)) { state = { ...load(), ...data }; save(); }
  } catch (err) { alert('Import failed: ' + err.message); }
  e.target.value = '';
};
$('#locSave').onclick = () => {
  const locs = $('#locInput').value.split(',').map(s => s.trim()).filter(Boolean);
  if (locs.length) { state.locations = [...new Set(locs)]; save(); }
};
$('#wipeBtn').onclick = () => { if (confirm('Delete ALL pantry data? This cannot be undone.')) { state = { items: [], shopping: [], locations: ['Pantry', 'Fridge', 'Freezer'] }; save(); } };
$('#sampleBtn').onclick = () => loadSample();

function loadSample() {
  const d = (n) => { const x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const mk = (name, qty, unit, category, location, expiry, low) => ({ id: uid(), name, qty, unit, category, location, expiry, low, notes: '', added: d(0) });
  state.items.push(
    mk('Milk', 1, 'L', 'Dairy', 'Fridge', d(2), 1),
    mk('Eggs', 4, 'pcs', 'Dairy', 'Fridge', d(10), 6),
    mk('Basmati rice', 2, 'kg', 'Grains & Pasta', 'Pantry', d(200), 1),
    mk('Spinach', 1, 'pack', 'Produce', 'Fridge', d(-1), ''),
    mk('Tomatoes', 6, 'pcs', 'Produce', 'Fridge', d(5), 3),
    mk('Chickpeas', 3, 'can', 'Canned', 'Pantry', d(400), 2),
    mk('Frozen peas', 500, 'g', 'Frozen', 'Freezer', d(120), 200),
    mk('Olive oil', 0, 'bottle', 'Grains & Pasta', 'Pantry', '', 1),
  );
  save();
}

// ---- tabs & filters ----
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'tab-' + b.dataset.tab);
});
document.querySelectorAll('.stat').forEach(s => s.onclick = () => { $('#filterStatus').value = s.dataset.filter; renderStock(); });
['#search', '#filterLoc', '#filterStatus', '#sortBy'].forEach(s => $(s).addEventListener('input', renderStock));
$('#addBtn').onclick = () => openItem();

render();
</script>
</body>
</html>
